; Образец настроек. Удобнее заполнять в программе: Прочее → Настройки. Можно и вручную: скопируйте в config.ini и впишите значения.
; config.ini в GitHub НЕ попадает — ключи хранятся только на компьютере / сервере.

[shop]
; название магазина в меню
name = Mocheqi

[wb]
; ЛК WB → Настройки → Доступ к API → Создать токен. Тип: базовый, «Только на чтение».
; Категории: Статистика, Аналитика, Маркетплейс, Финансы, Продвижение, Цены и скидки, Поставки.
token =
; отдельный токен WB с категорией «Контент» без «Только на чтение» — для замены фото (Маркетинг → Фотоконтент)
content_token =

[ozon]
; ЛК Ozon → Настройки → API ключи → Сгенерировать ключ (роль «Admin read only»).
client_id =
api_key =

[tax]
; Ставка УСН «Доходы», %
usn_percent = 6
; Ставка НДС, % (если платите НДС; иначе 0)
nds_percent = 5

[server]
; 1 — открывать дашборд другим устройствам в сети (после создания первого пользователя)
network = 0
; порт дашборда (на сервере менять, только если 8765 занят)
port = 8765

[gsheet]
; Google Таблица с операциями: ссылка вида https://docs.google.com/spreadsheets/d/<ID>/export?format=csv&gid=<GID>
url =
